# Local PostgreSQL for development. The API creates its own schema (Flyway) on first start.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mahtem
      POSTGRES_USER: mahtem
      POSTGRES_PASSWORD: mahtem
    ports:
      - "5432:5432"
    volumes:
      - mahtem-data:/var/lib/postgresql/data
volumes:
  mahtem-data:
